# Format definitions for Cuttle (Phase 1)
# Single source of truth for supported formats.
# kind: 'video' | 'audio' | 'image' | 'document'
# ext: list of file extensions without dot
# magic: identifier matched by detect.py

[formats.mp4]
kind = "video"
ext = ["mp4", "m4v"]
magic = "ftyp"

[formats.mkv]
kind = "video"
ext = ["mkv"]
magic = "matroska"

[formats.mov]
kind = "video"
ext = ["mov"]
magic = "moov_or_qt"

[formats.avi]
kind = "video"
ext = ["avi"]
magic = "riff_avi"

[formats.webm]
kind = "video"
ext = ["webm"]
magic = "matroska"

[formats.mp3]
kind = "audio"
ext = ["mp3"]
magic = "id3_or_frame"

[formats.wav]
kind = "audio"
ext = ["wav"]
magic = "riff_wave"

[formats.gif]
kind = "image"
ext = ["gif"]
magic = "gif"

[formats.png]
kind = "image"
ext = ["png"]
magic = "png"

[formats.jpg]
kind = "image"
ext = ["jpg", "jpeg"]
magic = "jpeg"

[formats.webp]
kind = "image"
ext = ["webp"]
magic = "riff_webp"

[formats.bmp]
kind = "image"
ext = ["bmp"]
magic = "bmp"

[formats.tiff]
kind = "image"
ext = ["tiff", "tif"]
magic = "tiff"

[formats.heic]
kind = "image"
ext = ["heic", "heif"]
magic = "ftyp_heic"

# Documents (Phase 3)
[formats.md]
kind = "document"
ext = ["md", "markdown"]
magic = "text_markdown"

[formats.html]
kind = "document"
ext = ["html", "htm"]
magic = "text_html"

[formats.docx]
kind = "document"
ext = ["docx"]
magic = "zip_docx"

[formats.txt]
kind = "document"
ext = ["txt"]
magic = "text_plain"

[formats.pdf]
kind = "document"
ext = ["pdf"]
magic = "pdf"

[formats.pptx]
kind = "document"
ext = ["pptx"]
magic = "zip_pptx"

[formats.xlsx]
kind = "document"
ext = ["xlsx"]
magic = "zip_xlsx"

[formats.odt]
kind = "document"
ext = ["odt"]
magic = "zip_odt"

# CAD / Engineering Drawings (Phase 5)
[formats.dwg]
kind = "document"
ext = ["dwg"]
magic = "cad_dwg"

[formats.dxf]
kind = "document"
ext = ["dxf"]
magic = "cad_dxf"

