# Conversion edges for Cuttle (Phase 1)
# Single source of truth for what converts to what.
# src, dst: format IDs from formats.toml
# adapter: adapter name ('ffmpeg', 'image')
# quality: 'lossless' | 'lossy' | 'best_effort'
# cost: integer 1 (cheap) .. 10 (expensive)
# label: display label for right-click menu
# requires: optional list of external tools required (e.g. ['libreoffice'])
# options: optional key-value settings for adapter

# --- Video to Video / Audio / Animation (FFmpeg) ---

# MP4 conversions
[[edge]]
src = "mp4"
dst = "webm"
adapter = "ffmpeg"
quality = "lossy"
cost = 5
label = "WebM (video)"

[[edge]]
src = "mp4"
dst = "gif"
adapter = "ffmpeg"
quality = "lossy"
cost = 5
label = "GIF (animation)"

[[edge]]
src = "mp4"
dst = "mp3"
adapter = "ffmpeg"
quality = "lossy"
cost = 3
label = "MP3 (audio)"

[[edge]]
src = "mp4"
dst = "wav"
adapter = "ffmpeg"
quality = "lossless"
cost = 2
label = "WAV (audio)"

